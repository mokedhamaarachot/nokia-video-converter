<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ממיר וידאו לנוקיה - MOCOR Pro Web</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ffmpeg/0.11.6/ffmpeg.min.js" integrity="sha512-u3N8YvKoxeF70itvwzC7scU8YI8bTOfTlg0itidVwWpInDBy09S084LInscRcoVwXv9S4xU9vOId3j/mK76FPA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        body {
            background-color: #12131a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 30px;
            margin: 0;
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
        }
        .icon { font-size: 50px; color: #7952b3; margin-top: 20px; }
        h2 { margin: 10px 0 5px 0; }
        .subtitle { color: #8a8b98; font-size: 14px; margin-bottom: 30px; }
        
        .drop-zone {
            border: 2px dashed #4e5166;
            background-color: #1a1b24;
            padding: 40px;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .drop-zone:hover { border-color: #00adb5; }
        
        .btn {
            background-color: #222533;
            color: #555555;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 25px;
            cursor: not-allowed;
            width: 100%;
            transition: all 0.3s;
        }
        .active-btn {
            background-color: #7952b3;
            color: white;
            cursor: pointer;
        }
        .active-btn:hover { background-color: #8a63c4; }

        #statusSection { margin-top: 20px; display: none; }
        .progress-bar-container {
            width: 100%;
            background-color: #1a1b24;
            border-radius: 5px;
            height: 12px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #00adb5;
            transition: width 0.2s ease;
        }
        #statusText { color: #ff9f43; font-weight: bold; font-size: 14px; margin-top: 5px;}
    </style>
</head>
<body>

<div class="container">
    <div class="icon">📱</div>
    <h2>ממיר וידאו לנוקיה</h2>
    <div class="subtitle">עובד לכל המכשירים מבוססי MOCOR (רץ ישירות בדפדפן)</div>

    <div class="drop-zone" id="dropZone">
        <div style="font-size: 40px; color: #4e5166;">📥</div>
        <p id="dropText">גרור סרטון לכאן<br><br>או לחץ לבחירה ידנית</p>
        <input type="file" id="fileInput" accept="video/*" style="display: none;">
    </div>

    <div id="statusSection">
        <div id="statusText">מכין את קובץ הוידאו...</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <button class="btn" id="convertBtn" disabled>🚀 התחל המרה קבוצתית</button>
</div>

<script>
    // שימוש באובייקט ה-FFmpeg הגלובלי שנטען מה-CDN
    const { createFFmpeg, fetchFile } = FFmpeg;
    let ffmpeg = null;

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const convertBtn = document.getElementById('convertBtn');
    const dropText = document.getElementById('dropText');
    const statusSection = document.getElementById('statusSection');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');
    
    let selectedFile = null;

    // הפעלת בחירת הקובץ בלחיצה על אזור הגרירה
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    // מנגנון הגרירה והשחרור (Drag & Drop)
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#00adb5'; });
    dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = '#4e5166'; });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#4e5166';
        handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
        if (files.length > 0) {
            selectedFile = files[0];
            dropText.innerHTML = `📊 נטען קובץ בהצלחה!<br><b>${selectedFile.name}</b>`;
            dropText.style.color = '#00adb5';
            convertBtn.disabled = false;
            convertBtn.classList.add('active-btn');
        }
    }

    // פעולת ההמרה בלחיצה על הכפתור
    convertBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        // נעילת הממשק כדי למנוע לחיצות כפולות
        convertBtn.disabled = true;
        convertBtn.classList.remove('active-btn');
        statusSection.style.display = 'block';
        progressBar.style.width = '0%';
        statusText.style.color = '#ff9f43';

        try {
            // אתחול מנוע ה-FFmpeg רק בלחיצה הראשונה
            if (!ffmpeg) {
                statusText.innerText = "טוען את מנוע המרה (בפעם הראשונה זה לוקח מספר שניות)...";
                ffmpeg = createFFmpeg({ log: true });
                
                // האזנה להתקדמות האחוזים של FFmpeg
                ffmpeg.setProgress(({ ratio }) => {
                    let pct = Math.round(ratio * 100);
                    if (pct >= 0 && pct <= 100) {
                        progressBar.style.width = pct + '%';
                        statusText.innerText = `ממיר כעת: ${pct}%`;
                    }
                });
                
                await ffmpeg.load();
            }

            statusText.innerText = "טוען את הסרטון לזיכרון הווירטואלי...";
            const inputName = 'input_' + selectedFile.name;
            const outputName = 'output_nokia.mp4';
            
            // כתיבת הקובץ לזיכרון של הדפדפן
            ffmpeg.FS('writeFile', inputName, await fetchFile(selectedFile));

            statusText.innerText = "ממיר וידאו... אנא המתן ולא לסגור את הלשונית";

            // פקודת ה-FFmpeg המדויקת מהקוד המקורי שלך
            await ffmpeg.run(
                '-i', inputName,
                '-vf', 'scale=320:240:force_original_aspect_ratio=decrease,pad=320:240:(ow-iw)/2:(oh-ih)/2',
                '-vcodec', 'libx264', 
                '-profile:v', 'baseline', 
                '-level', '3.0',
                '-b:v', '250k', 
                '-maxrate', '300k', 
                '-bufsize', '500k',
                '-acodec', 'aac', 
                '-b:a', '52k', 
                '-ac', '1',
                '-async', '1', 
                '-vsync', 'cfr', 
                outputName
            );

            statusText.innerText = "ההמרה הסתיימה בהצלחה! מייצר קובץ להורדה...";

            // קריאת הקובץ המוכן מהזיכרון הווירטואלי והורדתו למחשב
            const data = ffmpeg.FS('readFile', outputName);
            const blob = new Blob([data.buffer], { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = selectedFile.name.substring(0, selectedFile.name.lastIndexOf('.')) + '_nokia.mp4';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            // ניקוי הקבצים מהזיכרון הווירטואלי כדי שלא יכבידו על הדפדפן
            ffmpeg.FS('unlink', inputName);
            ffmpeg.FS('unlink', outputName);

            statusText.innerText = "התהליך הסתיים בהצלחה! הקובץ ירד 🎉";
            statusText.style.color = "#00adb5";

        } catch (error) {
            console.error(error);
            statusText.innerText = "אירעה שגיאה בזמן ההמרה. ודא שהקובץ תקין.";
            statusText.style.color = "#ff4d4d";
        } finally {
            // שחרור הכפתור לעבודה נוספת
            convertBtn.disabled = false;
            convertBtn.classList.add('active-btn');
        }
    });
</script>

</body>
</html>
